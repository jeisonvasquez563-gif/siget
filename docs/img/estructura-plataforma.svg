<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Estructura de la plataforma SIGET</title>
<desc>El navegador entra por nginx y Django en la VM1 (aplicación), que habla por TLS 1.3 con PostgreSQL en la VM2 (base de datos). Teal: existe hoy. Morado: se construye.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#FFFFFF"/>
<g><rect x="60" y="30" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="145" y="49" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Navegador</text><text x="145" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">HTTPS y React (SPA)</text></g>
<rect x="470" y="40" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="490" y="46" dominant-baseline="central" font-size="12" fill="#444441">Se construye</text>
<rect x="470" y="62" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="490" y="68" dominant-baseline="central" font-size="12" fill="#444441">Existe hoy</text>
<line x1="145" y1="86" x2="145" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="130" width="600" height="150" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="56" y="264" font-size="12" fill="#5F5E5A">VM1 · aplicación (Podman rootless)</text>
<g><rect x="60" y="150" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="140" y="169" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">nginx</text><text x="140" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">TLS, HSTS y CSP</text></g>
<g><rect x="260" y="150" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="345" y="169" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">Django + DRF</text><text x="345" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">PEP y PDP (ABAC)</text></g>
<g><rect x="470" y="150" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="545" y="169" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">Plazos y SLA</text><text x="545" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Escala vencidos</text></g>
<line x1="220" y1="178" x2="258" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="206" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="297" font-size="12" fill="#444441">TLS 1.3 verificado</text>
<rect x="40" y="310" width="600" height="150" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="56" y="444" font-size="12" fill="#5F5E5A">VM2 · base de datos (PostgreSQL 16)</text>
<g><rect x="60" y="330" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="145" y="349" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Roles y RLS</text><text x="145" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Mínimo privilegio</text></g>
<g><rect x="255" y="330" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="349" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Auditoría</text><text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Solo inserción</text></g>
<g><rect x="450" y="330" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="535" y="349" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Datos</text><text x="535" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Trámites y catálogo</text></g>
<rect x="40" y="478" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Transversal: SELinux, firewall, secretos, registro y Tailscale</text>
</svg>
