name: backend-ci

# Solo corre cuando cambia algo del backend (o de este mismo flujo): cada frente tiene su propia verificación.
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [develop, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Pruebas sin base de datos: el PDP, la autenticación, la serialización y la auditoría de rutas públicas.
      # Las pruebas contra la base real (verificar_*) corren en VM1 y se documentan en docs/runbook.md.
      - run: python -m pytest -q
