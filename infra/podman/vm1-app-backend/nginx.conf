# SIGET: nginx como única puerta de entrada (Zero Trust, principio 2: toda la comunicación se asegura).
# Corre sin root en el pod `siget`, junto al backend (que escucha solo en 127.0.0.1:8000 dentro del pod).
# El certificado y la clave llegan como `podman secret`; este archivo no contiene secretos.

pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # El sistema de archivos del contenedor es de solo lectura: los temporales van a /tmp (tmpfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Límites de tasa por dirección de origen
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_status 429;

    # HTTP: no sirve contenido, solo redirige a HTTPS
    server {
        listen 8080 default_server;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /run/secrets/siget-nginx-crt;
        ssl_certificate_key /run/secrets/siget-nginx-key;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # Cabeceras de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Solo los métodos que usa la API
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # La interfaz (SPA) se sirve desde una carpeta de solo lectura; todo lo demás que no sea API responde 404.
        # `expires` en vez de `add_header`: un add_header dentro de un location anula las cabeceras de seguridad del servidor.
        root /usr/share/nginx/html;

        location = / {
            limit_req zone=general burst=40 nodelay;
            expires -1;
            try_files /index.html =404;
        }

        location = /index.html {
            expires -1;
        }

        location /assets/ {
            limit_req zone=general burst=80 nodelay;
            expires 1y;
            try_files $uri =404;
        }

        location / {
            return 404;
        }

        # API: solo estos prefijos llegan al backend
        location ~ ^/(auth|tramites|catalogo|equipo|auditoria|salud)(/|$) {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
            proxy_hide_header X-Powered-By;
            # nginx es la única fuente de las cabeceras de seguridad: se descartan las que repite Django
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
        }
    }
}
